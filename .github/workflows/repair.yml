name: Repair auto-inactive
on:
  workflow_dispatch:
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - name: Dry run first
        run: python repair_auto_inactive.py --dry-run
      - name: Apply repair
        run: python repair_auto_inactive.py
      - name: Commit repaired state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/gc_state.json
          git diff --cached --quiet || git commit -m "Repair: clear false auto-inactive from March outage"
          git push
