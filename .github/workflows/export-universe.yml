name: Export universe review CSV

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run export
        run: python export_universe.py --out universe_review.csv

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: universe-review
          path: universe_review.csv
          retention-days: 7
