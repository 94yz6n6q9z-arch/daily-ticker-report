name: Daily Report

on:
  workflow_dispatch:
  schedule:
    # Dense retries during the UTC hours that map to 04:00–05:15 Europe/Vienna
    # across both CET and CEST. We avoid :00 because GitHub documents that the
    # start of every hour is a high-load period for scheduled workflows.
    #
    # Local valid attempts after the gate:
    #   CET : 04:07, 04:19, 04:31, 04:43, 04:55, 05:07
    #   CEST: 04:07, 04:19, 04:31, 04:43, 04:55, 05:07
    # Sat morning still catches Friday's market close. Sun is the only full rest day.
    - cron: "7,19,31,43,55 2-4 * * 1-6"

permissions:
  contents: write

# Opt into Node.js 24 now — actions/checkout, setup-python, and upload-artifact
# will be forced onto it by GitHub on June 2, 2026 anyway.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TZ: Europe/Vienna
      PUBLIC_IMG_BASE: https://94yz6n6q9z-arch.github.io/daily-ticker-report

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether to run (manual always sends; scheduled latest-safe-start + lock)
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, time, timezone
          from pathlib import Path

          event_name = (os.environ.get("EVENT_NAME") or "").strip()
          schedule_expr = (os.environ.get("SCHEDULE_EXPR") or "").strip()
          now_local = datetime.now()  # TZ is set by workflow env
          now_utc = datetime.now(timezone.utc)
          today = now_local.strftime("%Y-%m-%d")
          now_hm = now_local.strftime("%H:%M")

          # Business rule (Europe/Vienna local time):
          # - Earliest send attempt: 04:00
          # - Latest safe start:    05:15
          # Anything after 05:15 is too late to guarantee inbox delivery by 06:00.
          start = time(4, 0)
          latest_start = time(5, 15)

          def in_window(t):
              return start <= t <= latest_start

          run = False
          reason = ""

          if event_name == "workflow_dispatch":
              run = True
              reason = "manual_run"
          else:
              if not in_window(now_local.time()):
                  run = False
                  reason = f"outside_window ({now_hm} not in 04:00-05:15 Europe/Vienna)"
              else:
                  lock = Path("docs/email_state.json")
                  last = ""
                  if lock.exists():
                      try:
                          last = json.loads(lock.read_text(encoding="utf-8")).get("last_sent_date","") or ""
                      except Exception:
                          last = ""
                  if last == today:
                      run = False
                      reason = f"already_sent_today ({last})"
                  else:
                      run = True
                      reason = "scheduled_in_window_and_not_sent"

          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as f:
              f.write(f"run={'true' if run else 'false'}\n")
              f.write(f"reason={reason}\n")
              f.write(f"today={today}\n")
              f.write(f"now_hm={now_hm}\n")
              f.write(f"event={event_name}\n")
              f.write(f"schedule_expr={schedule_expr}\n")
              f.write(f"local_ts={now_local.strftime('%Y-%m-%d %H:%M:%S %Z')}\n")
              f.write(f"utc_ts={now_utc.strftime('%Y-%m-%d %H:%M:%S UTC')}\n")
          print(
              "gate:",
              {"run": run, "reason": reason, "event": event_name, "schedule": schedule_expr,
               "local": now_local.strftime('%Y-%m-%d %H:%M:%S %Z'),
               "utc": now_utc.strftime('%Y-%m-%d %H:%M:%S UTC')}
          )
          PY

      - name: Stop early (no-op run)
        if: ${{ steps.gate.outputs.run != 'true' }}
        run: |
          echo "Skipping: ${{ steps.gate.outputs.reason }}"
          echo "Event:    ${{ steps.gate.outputs.event }}"
          echo "Schedule: ${{ steps.gate.outputs.schedule_expr }}"
          echo "Local:    ${{ steps.gate.outputs.local_ts }}"
          echo "UTC:      ${{ steps.gate.outputs.utc_ts }}"

      - name: Check gc_state.json freshness (scheduled runs require fresh GC data)
        if: ${{ steps.gate.outputs.run == 'true' }}
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import sys
          import os
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          event_name = (os.environ.get("EVENT_NAME") or "").strip()
          p = Path("docs/gc_state.json")
          if not p.exists():
              msg = "docs/gc_state.json not found. gc-data may not have run or may have failed."
              if event_name == "schedule":
                  print(f"ERROR: {msg}")
                  sys.exit(1)
              print(f"WARNING: {msg} Manual run will continue.")
              sys.exit(0)

          mtime = datetime.fromtimestamp(p.stat().st_mtime, tz=timezone.utc)
          age = datetime.now(timezone.utc) - mtime
          print(f"gc_state.json age: {age}")

          max_age = timedelta(hours=8)
          if age > max_age:
              msg = f"gc_state.json is stale ({age}; expected < {max_age})."
              if event_name == "schedule":
                  print(f"ERROR: {msg}")
                  sys.exit(1)
              print(f"WARNING: {msg} Manual run will continue.")
          else:
              print(f"gc_state.json is fresh ({age} old). OK.")
          PY

      - name: Log trigger diagnostics
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          echo "Event:    ${{ steps.gate.outputs.event }}"
          echo "Schedule: ${{ steps.gate.outputs.schedule_expr }}"
          echo "Local:    ${{ steps.gate.outputs.local_ts }}"
          echo "UTC:      ${{ steps.gate.outputs.utc_ts }}"
          echo "Reason:   ${{ steps.gate.outputs.reason }}"

      - name: Set up Python
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install markdown

      - name: Run scan (capture log)
        if: ${{ steps.gate.outputs.run == 'true' }}
        id: scan1
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.2
          OPENAI_REASONING_EFFORT: medium
          EXEC_SUMMARY_DEBUG: "1"
          MODE: full
        run: |
          set -o pipefail
          mkdir -p docs
          python scan.py 2>&1 | tee docs/scan.log
          exit ${PIPESTATUS[0]}

      - name: Retry scan once (if first attempt failed)
        if: ${{ steps.gate.outputs.run == 'true' && steps.scan1.outcome == 'failure' }}
        id: scan2
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.2
          OPENAI_REASONING_EFFORT: medium
          EXEC_SUMMARY_DEBUG: "1"
          MODE: full
        run: |
          set -o pipefail
          echo "First run failed; retrying in 60s..."
          sleep 60
          python scan.py 2>&1 | tee -a docs/scan.log
          exit ${PIPESTATUS[0]}

      - name: Determine scan status
        if: ${{ steps.gate.outputs.run == 'true' }}
        id: status
        run: |
          if [ -f docs/report.md ]; then
            echo "ok=true" >> $GITHUB_OUTPUT
          else
            echo "ok=false" >> $GITHUB_OUTPUT
          fi

      - name: Prepare email bodies (HTML + text)
        if: ${{ steps.gate.outputs.run == 'true' }}
        env:
          PUBLIC_IMG_BASE: ${{ env.PUBLIC_IMG_BASE }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import markdown as md

          base = os.environ.get("PUBLIC_IMG_BASE","").rstrip("/")
          docs = Path("docs"); docs.mkdir(parents=True, exist_ok=True)

          report = docs / "report.md"
          scanlog = docs / "scan.log"

          if report.exists():
              txt = report.read_text(encoding="utf-8", errors="ignore")
              if base:
                  txt = txt.replace("(img/", f"({base}/img/")
                  txt = txt.replace('src="img/', f'src="{base}/img/')
                  txt = txt.replace("src='img/", f"src='{base}/img/")
              (docs / "email.md").write_text(txt, encoding="utf-8")

              body_html = md.markdown(txt, extensions=["tables","sane_lists","fenced_code"])
              html = "<!doctype html><html><head>" \
                     "<meta charset='utf-8'/><meta name='viewport' content='width=device-width, initial-scale=1'/>" \
                     "<style>" \
                     "body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif;line-height:1.35;}" \
                     "h1,h2,h3{margin:16px 0 10px;}" \
                     "table{border-collapse:collapse;width:100%;margin:10px 0 18px;}" \
                     "th,td{border:1px solid #ddd;padding:8px;vertical-align:top;}" \
                     "th{background:#f6f8fa;}" \
                     "img{max-width:100%;height:auto;}" \
                     "</style></head><body>" + body_html + "</body></html>"
              (docs / "email.html").write_text(html, encoding="utf-8")

              (docs / "email.txt").write_text(txt[:12000], encoding="utf-8")
          else:
              log_tail = ""
              if scanlog.exists():
                  lines = scanlog.read_text(encoding="utf-8", errors="ignore").splitlines()
                  log_tail = "\n".join(lines[-120:])
              txt = "Daily Ticker Report — ERROR\n\nscan.py did not produce docs/report.md.\n\nLast log lines:\n" + log_tail
              (docs / "email.txt").write_text(txt[:12000], encoding="utf-8")
              html = "<html><body><h1>Daily Ticker Report</h1><h2>ERROR</h2><pre style='white-space:pre-wrap'>" + \
                     (txt.replace("&","&amp;").replace("<","&lt;").replace(">","&gt;")) + \
                     "</pre></body></html>"
              (docs / "email.html").write_text(html, encoding="utf-8")
              (docs / "email.md").write_text(txt, encoding="utf-8")
          PY

      - name: Commit and push report
        if: ${{ steps.gate.outputs.run == 'true' && steps.status.outputs.ok == 'true' }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p docs/img
          git add docs/report.md docs/index.md docs/state.json docs/img docs/email.md docs/email.html docs/email.txt || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily report update"
            git push
          fi

      - name: Compute subject timestamp
        if: ${{ steps.gate.outputs.run == 'true' }}
        id: subject
        run: |
          echo "subject=Daily Ticker Report — $(date +'%Y-%m-%d %H:%M %Z')" >> $GITHUB_OUTPUT

      - name: Verify mail secrets (fail early with clear error)
        if: ${{ steps.gate.outputs.run == 'true' }}
        env:
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          test -n "$MAIL_TO" || (echo "MAIL_TO secret missing/empty" && exit 1)
          test -n "$MAIL_USERNAME" || (echo "MAIL_USERNAME secret missing/empty" && exit 1)
          test -n "$MAIL_PASSWORD" || (echo "MAIL_PASSWORD secret missing/empty" && exit 1)

      - name: Send email (inline macro charts)
        if: ${{ steps.gate.outputs.run == 'true' }}
        env:
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_SUBJECT: ${{ steps.subject.outputs.subject }}
        run: |
          python tools/send_gmail_inline.py

      - name: Update once-per-day email lock (scheduled runs only)
        if: ${{ steps.gate.outputs.run == 'true' && github.event_name == 'schedule' }}
        run: |
          set -e
          mkdir -p docs
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime

          p = Path("docs/email_state.json")
          p.parent.mkdir(parents=True, exist_ok=True)

          now = datetime.now()
          state = {
            "last_sent_date": now.strftime("%Y-%m-%d"),
            "last_sent_ts": now.strftime("%Y-%m-%d %H:%M:%S"),
          }
          p.write_text(json.dumps(state, indent=2), encoding="utf-8")
          print("Wrote", p)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/email_state.json || true
          if git diff --cached --quiet; then
            echo "No lock changes to commit."
          else
            git commit -m "Email lock update [skip ci]"
            git push
          fi
