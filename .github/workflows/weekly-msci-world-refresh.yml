name: Weekly MSCI World + EM Refresh

on:
  workflow_dispatch:
  schedule:
    # Weekly on Sunday at 03:15 UTC
    - cron: "15 3 * * 0"

permissions:
  contents: write

concurrency:
  group: weekly-msci-world-refresh
  cancel-in-progress: false

jobs:
  refresh-msci-world:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Europe/Berlin
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas requests
          fi

      - name: Verify refresh script exists
        run: |
          test -f tools/update_msci_world_classification.py
          echo "Found tools/update_msci_world_classification.py"

      # Downloads XLS directly from iShares (not CSV API).
      # Exchange column in XLS is source of truth for Yahoo suffix mapping.
      # ~1,300 World stocks + ~830 EM stocks = ~2,100 unique tickers total.
      - name: Refresh MSCI World + EM classification
        run: |
          cd ${{ github.workspace }}
          python tools/update_msci_world_classification.py \
            --universe both \
            --out config/msci_world_classification.csv \
            --out-em config/msci_em_classification.csv \
            --meta docs/msci_world_classification_meta.json \
            --meta-em docs/msci_em_classification_meta.json

      - name: Commit and push changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            config/msci_world_classification.csv \
            config/msci_em_classification.csv \
            docs/msci_world_classification_meta.json \
            docs/msci_em_classification_meta.json \
            || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Weekly MSCI World + EM refresh [skip ci] $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
