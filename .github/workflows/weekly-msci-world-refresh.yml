name: Weekly MSCI World Refresh

on:
  workflow_dispatch:
  schedule:
    # Weekly on Sunday at 03:15 UTC
    - cron: "15 3 * * 0"

permissions:
  contents: write

concurrency:
  group: weekly-msci-world-refresh
  cancel-in-progress: false

jobs:
  refresh-msci-world:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas requests
          fi

      - name: Verify refresh script exists
        run: |
          test -f tools/update_msci_world_classification.py
          echo "Found tools/update_msci_world_classification.py"

      - name: Run weekly MSCI World + EM refresh
        run: |
          python tools/update_msci_world_classification.py \
            --universe both \
            --out config/msci_world_classification.csv \
            --out-em config/msci_em_classification.csv \
            --meta docs/msci_world_classification_meta.json \
            --meta-em docs/msci_em_classification_meta.json

      - name: Run weekly MSCI Korea refresh (EWY)
        # Korea runs as a separate step so a failure here does not block World/EM.
        # EWY gives clean .KS Yahoo Finance symbols (000660.KS, 005930.KS etc.)
        # that the EM fund (EEM/EIMI) produces incorrectly due to iShares
        # numeric-ticker formatting quirks for Korean stocks.
        run: |
          python tools/update_msci_world_classification.py \
            --universe korea \
            --out-korea config/msci_korea_classification.csv \
            --meta-korea docs/msci_korea_classification_meta.json \
            --min-rows-korea 80

      - name: Commit and push changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Weekly MSCI World + EM + Korea refresh [skip ci]"
          git push
