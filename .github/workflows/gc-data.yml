# .github/workflows/gc-data.yml
# Run Growth Compounder data layer — fetches/caches earnings data for
# MSCI World + MSCI EM standard universe (~2,100 tickers).
#
# Schedule: starts 23:00 CET (22:00 UTC) Mon–Fri, after US earnings drop.
# Runtime: ~1 hour (down from ~3hr after universe simplification to 2 ETFs).
# Daily report (daily.yml) runs at 04:00 CET (03:00 UTC).
#
# Data source priority:
#   1. yfinance (4-method EPS chain, exchange-ordered fetch, 1–1.5s per ticker)
#   2. yfinance retry pass (60s cooldown)
#   3. FMP fallback — only for tickers still empty after both yfinance passes
#      Priority order: UK (.L) → Korea (.KS) → Japan (.T) → rest
#      Requires FMP_API_KEY secret (free tier: 250 calls/day ≈ 125 tickers)
#
# To activate FMP: repo Settings → Secrets → Add FMP_API_KEY

name: gc-data-refresh

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-download all earnings data (ignore cache)'
        required: false
        default: 'false'
        type: boolean
      limit:
        description: 'Limit universe size for testing (0 = full universe)'
        required: false
        default: '0'
        type: string
  schedule:
    # 23:00 CET = 22:00 UTC Sun–Fri (after US market close + after-hours earnings)
    # Sunday run added so Monday's 04:00 CET report uses fresh data (not Friday's).
    - cron: '0 22 * * 0-5'

jobs:
  gc-data:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas numpy lxml requests

      - name: Refresh MSCI World classification
        run: |
          cd ${{ github.workspace }}
          python tools/update_msci_world_classification.py --universe world \
            --out config/msci_world_classification.csv \
            --meta docs/msci_world_classification_meta.json

      - name: Refresh MSCI EM classification
        run: |
          cd ${{ github.workspace }}
          python tools/update_msci_world_classification.py --universe em \
            --out-em config/msci_em_classification.csv \
            --meta-em docs/msci_em_classification_meta.json

      # ── ONE-TIME ONLY: remove stale gc_state entries from old 6,400-ticker universe ──
      # After this run, delete these 3 lines (or the step will harmlessly no-op forever).
      - name: One-time gc_state cleanup (remove stale tickers from old universe)
        run: python tools/gc_state_cleanup.py --apply

      - name: Run GC data layer
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          cd ${{ github.workspace }}
          FORCE_FLAG=""
          if [ "${{ inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          LIMIT_FLAG=""
          if [ "${{ inputs.limit }}" != "0" ] && [ -n "${{ inputs.limit }}" ]; then
            LIMIT_FLAG="--limit ${{ inputs.limit }}"
          fi
          python gc_engine.py --mode data $FORCE_FLAG $LIMIT_FLAG

      - name: Commit and push changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/gc_state.json \
                  config/msci_world_classification.csv \
                  config/msci_em_classification.csv \
                  docs/msci_world_classification_meta.json \
                  docs/msci_em_classification_meta.json
          git diff --cached --quiet || git commit -m "GC data + MSCI refresh $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
